name: cf-tunnel-panel

# 全部使用 host 网络：这样面板/caddy/cloudflared 都能直接访问 127.0.0.1:端口 的内网服务，
# 也不用为每个服务搞 extra_hosts（与 cloudflared 官方建议一致）。
services:
  # 注意：panel 放在 profile 里，默认 `docker compose up -d` 不会去动它。
  # 面板的生命周期交给 tools/rolling-upgrade.sh（blue ↔ green 两个容器名交替），
  # 否则 compose 和脚本会抢同一个容器名 / 同一个端口（实测报 name conflict）。
  # 全新部署（第一次）才需要显式把蓝色起起来：
  #   docker compose --profile bootstrap up -d panel
  #   # 或者： tools/rolling-upgrade.sh --bootstrap --apply
  panel:
    profiles: ["bootstrap"]
    build: .
    image: cf-tunnel-panel:local
    # 名字跟滚动升级的蓝色槽位一致：compose 负责「从零把蓝色起起来」，
    # 之后升级交给 tools/rolling-upgrade.sh（blue ↔ green 交替），两边不再抢同一个容器名。
    container_name: ${PANEL_CONTAINER:-cf-tunnel-panel-blue}
    network_mode: host
    # 以宿主机用户身份运行，避免 data/state.json 变成 root 属主（宿主机读不了、备份脚本写不了）
    # 首次启用前先把数据目录交给同一个 uid：docker exec -u 0 cf-tunnel-panel chown -R 1000:1000 /data
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    volumes:
      - ./data:/data
      # Docker 容器清单 → 面板「一键加规则」。只读挂载即可（API 走 unix socket）
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: Asia/Shanghai
      PORT: "8090"           # 面板 UI
      CADDY_ADMIN: http://127.0.0.1:20190
      CADDY_LISTEN: "127.0.0.1:8080"  # 代理入口（隧道应指向这里）
      LOG_STDOUT: "1"
      # Node 22 默认先用 IPv6 连外网。本机与容器都没有 IPv6 出口，而 demo/panel 两个
      # 域名的 DNS 同时给 A+AAAA，内置 fetch 挑中 AAAA 就卡到超时，体检的 exit-*
      # 两项会误报「请求失败：fetch failed」。强制 IPv4 优先即可。
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      # 滚动升级用的第二个槽位：长期预留一个端口给"接班"的实例。
      # 主实例拿到这个 peer 才会把面板规则下发成「双上游 + 主动健康检查」，
      # 新实例在 8095 起来后先当 standby，老实例退出时 Caddy 自动把流量切过去。
      # 不想用滚动升级就删掉这行（面板规则会退回单上游）。
      PANEL_SLOT_PEERS: "${PANEL_SLOT_PEERS:-8095}"
      # 想用面板 HTTPS：先生成证书到 ./data/tls/panel.crt|panel.key，再打开下面两行
      # PANEL_TLS_CERT: /data/tls/panel.crt
      # PANEL_TLS_KEY: /data/tls/panel.key
      # 限流：换成带 caddy-ratelimit 的 Caddy 镜像后设为 "1"（见 docs/RATELIMIT.md）
      # CADDY_RATELIMIT: "1"

  caddy:
    # 锁版本：面板生成的 JSON 依赖 2.11 的字段名（例如 load_balancing.selection_policy）
    image: caddy:2.11.9-alpine
    container_name: cf-tunnel-caddy
    network_mode: host
    restart: unless-stopped
    # 注意：JSON 配置是 Caddy 的原生格式，不能加 --adapter json（那只有 caddyfile 等适配器才有）
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    volumes:
      - ./caddy.bootstrap.json:/etc/caddy/caddy.json:ro
      # access log 落这个目录，面板只读同一份（./data/caddy-logs）做访问统计
      - ./data/caddy-logs:/logs
      - caddy_data:/data
      - caddy_config:/config

  # 演示上游：把请求头原样回显，用来验证「公网 -> 隧道 -> caddy -> 内网服务」整条链路
  demo:
    image: traefik/whoami:latest
    container_name: cf-tunnel-demo
    network_mode: host
    restart: unless-stopped
    command: ["--port=8091"]

volumes:
  caddy_data:
  caddy_config:

# Prometheus 抓取配置：两台面板实例都抓（8090 blue / 8095 green，谁在跑谁有数据）
# /metrics 免登录，所以不需要 basic_auth。
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cf-tunnel-panel
    metrics_path: /metrics
    # 只抓 8080：Caddy 里有一条 host=127.0.0.1 的规则指向「当前在跑的那一色」，
    # 所以这个 target 永远指向活着的槽位 —— 不会再出现「备份槽位长期 down」的假告警。
    # （以前写死 8090 + 8095，任何时刻必有一条红，等于把真信号泡成噪音。）
    static_configs:
      - targets: ['127.0.0.1:8080']

# 告警交给 Alertmanager 路由；Alertmanager 再把 webhook 打回面板（见 alertmanager.yml）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

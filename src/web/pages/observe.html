<div class="topbar">
  <div class="t"><h1>观测</h1><div class="sub">谁在访问、哪条规则在接、面板日志实时流</div></div>
  <div class="tools">
    <label class="inline"><input class="chk" type="checkbox" id="accessAuto" checked /> 自动刷新</label>
    <a class="btn sm ghost" id="btnAccessCsv" href="/api/access.csv?limit=200" download>导出 CSV</a>
    <button class="sm ghost" id="btnAccessRefresh">刷新</button>
  </div>
</div>

<div class="content stack">
  <div class="card flush">
    <div class="hd">
      <h2>访问统计</h2>
      <div class="sub" id="accessMsg">—</div>
      <div class="right">
        <select id="accStatus" style="width:auto" aria-label="按状态码筛选">
          <option value="">全部状态</option>
          <option value="2">只看 2xx</option>
          <option value="3">只看 3xx</option>
          <option value="4">只看 4xx</option>
          <option value="5">只看 5xx</option>
          <option value="err">只看错误（4xx + 5xx）</option>
        </select>
        <input id="accPath" placeholder="路径包含…" style="width:150px" aria-label="按路径筛选" />
        <button class="sm ghost" id="btnOnly5xx" aria-pressed="false" title="只显示状态码 ≥500 的请求">只看 5xx</button>
        <button class="sm ghost" id="btnMoreFilters" aria-expanded="false" aria-controls="accMore">更多筛选</button>
        <span class="filters-more hidden" id="accMore">
        <input id="accIp" placeholder="来源 IP…" style="width:130px" aria-label="按来源 IP 筛选" />
        <select id="accRange" style="width:auto" aria-label="时间范围">
          <option value="0">全部时间</option>
          <option value="300">最近 5 分钟</option>
          <option value="3600">最近 1 小时</option>
          <option value="86400">最近 24 小时</option>
        </select>
        </span>
      </div>
    </div>
    <div class="bd tight" id="accessBody"><div class="empty">读取中…</div></div>
  </div>


  <div class="grid2 obs-mid">
  <div class="card">
    <div class="hd">
      <h2>可疑访问（401 / 403）</h2>
      <div class="right">
        <select id="secHours" style="width:auto" aria-label="统计窗口">
          <option value="6">最近 6 小时</option>
          <option value="24" selected>最近 24 小时</option>
          <option value="72">最近 3 天</option>
          <option value="168">最近 7 天</option>
        </select>
        <button class="sm ghost" id="btnSecRefresh">刷新</button>
      </div>
    </div>
    <p class="hint" style="margin:0 0 8px">公网上的服务（尤其是 <code>/db</code>、<code>/term</code> 这类）会被人扫。这里按「规则」和「来源 IP」统计被拒的次数。<span class="muted" id="secMsg"></span></p>
    <div class="bd tight" id="secBody"><div class="empty">读取中…</div></div>
  </div>


  <div class="card">
    <div class="hd">
      <h2>规则命中统计</h2>
      <div class="right"><button class="sm ghost" id="btnRstatRefresh">刷新</button></div>
    </div>
    <p class="hint" style="margin:0 0 8px">按最近一段访问日志聚合：每条规则被打中多少次、错误率、P95 延迟。<span class="muted" id="rstatMsg"></span></p>
    <div class="bd tight" id="rstatBody"><div class="empty">读取中…</div></div>
  </div>
  </div>


  <div class="card">
    <div class="hd">
      <h2>审计日志</h2>
      <div class="right">
        <input id="auditQ" placeholder="搜人 / IP / 动作…" style="width:170px" aria-label="搜索审计日志" />
        <select id="auditAct" aria-label="按动作筛选审计日志" style="width:150px"><option value="">全部动作</option></select>
        <button class="sm ghost" id="btnAuditRefresh">刷新</button>
        <select id="auditDate" aria-label="按日期查看审计日志" style="width:150px">
          <option value="">最近两天</option>
        </select>
        <button class="sm ghost" id="btnAuditFail" aria-pressed="false" title="只看失败的记录（登录失败、跨站拦截、口令错误等）">只看失败</button>
        <a class="sm ghost" id="btnAuditCsv" href="/api/audit.csv?limit=2000" download>导出 CSV</a>
      </div>
    </div>
    <p class="hint" style="margin:0 0 8px">谁在什么时候、从哪个 IP、改了什么。只记"改动作 + 失败请求"，查看类请求不记，避免把日志刷爆。</p>
    <div class="bd tight" id="auditBody"><div class="empty">读取中…</div></div>
  </div>

  <div class="card flush">
    <div class="hd">
      <h2>面板日志</h2>
      <div class="right">
        <button class="sm ghost" id="btnLogToggle2" aria-expanded="false" aria-controls="logBox">展开</button>
        <input id="logFilter" placeholder="过滤关键字…" style="width:160px" aria-label="日志关键字过滤" />
        <label class="inline"><input class="chk" type="checkbox" id="logOnlyErr" /> 只看错误</label>
        <button class="sm ghost" id="btnLogPause" aria-pressed="false">暂停</button>
        <button class="sm ghost" id="btnLogDownload">下载</button>
      </div>
    </div>
    <pre class="log collapsed" id="logBox" aria-live="polite" style="border-radius:0 0 var(--radius) var(--radius)"></pre>
  </div>
</div>
